name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Server bog'liqliklari
        working-directory: server
        run: npm ci
      - name: Client bog'liqliklari
        working-directory: client
        run: npm ci

      - name: Server tiplari
        working-directory: server
        run: npx tsc --noEmit -p .
      - name: Unit va regressiya testlari
        working-directory: server
        run: npm test
      - name: Botlar simulyatsiyasi
        working-directory: server
        run: npm run test:sim

      - name: Client build (tiplar + vite)
        working-directory: client
        run: npm run build

      - name: WebSocket integratsiya testlari
        working-directory: server
        env:
          DATA_DIR: ${{ runner.temp }}/choyxona-data
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3001/api/health > /dev/null && break; sleep 1; done
          npm run test:integration
      - name: Server logi (xato bo'lsa)
        if: failure()
        working-directory: server
        run: cat server.log || true
